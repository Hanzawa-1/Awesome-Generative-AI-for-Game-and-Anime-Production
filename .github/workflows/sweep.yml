name: Daily catalog sweep

# Researches one auto-sized slice of the task list each day and commits it STRAIGHT TO main.
# The per-day task count is derived from the live taxonomy, so it adapts automatically when
# tasks are added/removed. Committing directly to main (instead of accumulating a weekly PR)
# means every run starts from the latest main and lands immediately, so consecutive runs never
# diverge or conflict with one another.

on:
  schedule:
    - cron: "0 0 * * *"   # 00:00 UTC daily = 09:00 JST
  workflow_dispatch:
    inputs:
      day:
        description: "Force day index 0-6 (blank = today by date; Mon=0..Sun=6)"
        default: ""
      max_iters:
        description: "Agent iterations per task"
        default: "25"
      dry_run:
        description: "Run the sweep but skip commit/push"
        type: boolean
        default: false

permissions:
  contents: write
  # Needed for the "Trigger Pages deploy" step: creating a workflow_dispatch
  # event with GITHUB_TOKEN requires the actions scope.
  actions: write

concurrency:
  group: catalog-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DISABLE_MKDOCS_2_WARNING: "true"
      # Provider selection (non-sensitive repo Variables)
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      # Secrets (only the one matching LLM_PROVIDER is required)
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AGENT_MAX_ITERS: ${{ github.event.inputs.max_iters || '25' }}
      # Per-task wall-clock so 8 tasks fit comfortably inside timeout-minutes even when
      # the free-tier LLM throttles (each task is capped independently).
      AGENT_WALL_CLOCK_SECONDS: "420"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync

      - name: Resolve day index
        id: plan
        run: |
          DAY="${{ github.event.inputs.day }}"
          if [ -z "$DAY" ]; then DAY=$(( $(date -u +'%u') - 1 )); fi
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          echo "Day index: $DAY"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run daily sweep
        # Thumbnails are generated at deploy build time (see deploy.yml), not here — the sweep
        # only touches the YAML data, keeping the repo free of committed PNGs.
        run: uv run python scripts/daily_sweep.py --day ${{ steps.plan.outputs.day }} --no-thumbnails --pr-body pr_body.md

      - name: Validate + build (sanity)
        run: |
          uv run python scripts/validate.py
          uv run python scripts/gen_catalog.py
          uv run mkdocs build --strict

      - name: Commit + push to main
        if: github.event.inputs.dry_run != 'true'
        id: commit
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "No new catalog changes this run."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(catalog): sweep $(date -u +'%Y-%m-%d') (day ${{ steps.plan.outputs.day }})"
            # A human commit could land on main during the ~90-min run; rebase onto it before
            # pushing so we fast-forward cleanly instead of racing.
            git pull --rebase origin main
            git push origin HEAD:main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Pages deploy
        # Pushes made with the default GITHUB_TOKEN do NOT trigger other workflows, so the
        # deploy-on-push in deploy.yml would never fire for a bot commit. workflow_dispatch is
        # the documented exception, so kick the deploy explicitly whenever this run pushed.
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
